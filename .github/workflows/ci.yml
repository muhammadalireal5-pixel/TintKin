name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    # Placeholder values only — never real secrets, and nothing here is a
    # GitHub secret on purpose. They exist so `next build` doesn't crash on
    # module-scope client construction during page-data collection (e.g.
    # app/lib/qwen.js builds its OpenAI client at import time). No external
    # service is actually reached during CI: Mongo connection attempts in
    # the build log fail and are retried/ignored, not fatal.
    env:
      MONGODB_URI: mongodb://localhost:27017/ci
      AUTH_SECRET: ci-placeholder-secret-not-real-0000000000000000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ci-placeholder
      CLOUDINARY_API_KEY: ci-placeholder
      CLOUDINARY_API_SECRET: ci-placeholder
      YOUCAM_API_KEY: ci-placeholder
      QWEN_API_KEY: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-placeholder
      ADMIN_SESSION_SECRET: ci-placeholder
      POLAR_ACCESS_TOKEN: ci-placeholder
      POLAR_WEBHOOK_SECRET: ci-placeholder
      POLAR_PRODUCT_ID_STANDARD: ci-placeholder
      POLAR_PRODUCT_ID_PREMIUM: ci-placeholder
      POLAR_ENVIRONMENT: sandbox
      ENABLE_DEMO_TIER_SWITCHING: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Informational only for now: the repo has a pre-existing baseline of
      # lint problems and type-check errors (see AUDIT.md) that predate this
      # pipeline. Blocking on them immediately would make every PR red for
      # debt nobody just introduced. Drop `continue-on-error` once that
      # baseline is cleaned up so these actually gate merges.
      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Type check
        run: bun run type-check
        continue-on-error: true

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
